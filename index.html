<!DOCTYPE html>
<html lang="es" class="w-full h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Meta etiquetas para vista previa al compartir (Open Graph / WhatsApp / Facebook) -->
  <title>Paolo Mi bautizo y 5 años🤠</title>
  <meta property="og:title" content="Paolo Mi bautizo y 5 años🤠">
  <meta property="og:description" content="¡Estás invitado a celebrar este momento tan especial!">
  <meta property="og:image" content="https://raw.githubusercontent.com/regina1503/PAOLO/main/PAOLO%20(2).jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:type" content="website">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome para iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* Estilo personalizado para los botones flotantes (Color Café) */
    .btn-maps {
      background-color: #8B4513; 
      backdrop-filter: blur(4px);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      transition: background-color 0.3s ease, transform 0.3s ease, opacity 0.3s ease;
    }
    .btn-maps:hover {
      background-color: #A0522D; 
    }
  </style>
</head>
<body class="w-full h-full m-0 p-0 bg-black overflow-hidden flex items-center justify-center">

  <main class="relative w-full h-full flex items-center justify-center">
    <!-- Reproductor de Video (Silenciado y con barra de controles) -->
    <video 
      id="mainVideo" 
      class="w-full h-full object-cover" 
      playsinline
      controls
      muted
      poster="https://raw.githubusercontent.com/regina1503/PAOLO/main/PAOLO%20(2).jpg"
    >
      <source src="https://raw.githubusercontent.com/regina1503/PAOLO/main/PAOLO%20(1).mp4" type="video/mp4">
      Tu navegador no soporta la reproducción de video HTML5.
    </video>

    <!-- Pista de Audio Externa (Edén Muñoz, Cosme Tadeo - La Nena) -->
    <audio id="bgAudio" preload="auto">
      <source src="https://raw.githubusercontent.com/regina1503/PAOLO/main/Eden%20Mu%C3%B1oz%2C%20Cosme%20Tadeo%20-%20La%20Nena%20LETRA.mp3" type="audio/mpeg">
    </audio>

    <!-- Botón de Play Central Personalizado -->
    <button 
      id="btnPlayCenter"
      class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-30 w-20 h-20 bg-[#8B4513]/90 hover:bg-[#A0522D] text-white rounded-full flex items-center justify-center shadow-2xl border-2 border-white/40 transition-all transform hover:scale-110 active:scale-95"
      aria-label="Reproducir video"
    >
      <i class="fa-solid fa-play text-3xl ml-1"></i>
    </button>

    <!-- Pantalla Final: Código de Vestimenta Vaquero -->
    <div 
      id="outfitOverlay" 
      class="hidden absolute inset-0 bg-black/90 backdrop-blur-md z-40 flex flex-col items-center justify-center p-6 text-center transition-opacity duration-500 opacity-0"
    >
      <div class="border-2 border-[#8B4513] rounded-2xl p-8 max-w-sm w-full bg-slate-950/80 shadow-2xl space-y-4">
        <div class="w-16 h-16 mx-auto rounded-full bg-[#8B4513]/30 border border-[#8B4513] flex items-center justify-center text-amber-500 text-3xl">
          🤠
        </div>
        <h2 class="text-xl font-bold text-amber-100 uppercase tracking-wide">
          Código de Vestimenta
        </h2>
        <div class="h-0.5 w-16 bg-[#8B4513] mx-auto"></div>
        <p class="text-sm text-slate-200 leading-relaxed font-light">
          ¡Prepara tu sombrero y tus botas! <br>
          <span class="font-semibold text-amber-400">El outfit tipo vaquero es obligatorio</span> para celebrar con nosotros.
        </p>
        <button 
          id="btnReplay"
          class="mt-4 px-5 py-2.5 bg-[#8B4513] hover:bg-[#A0522D] text-white text-xs font-semibold rounded-lg shadow-lg border border-white/20 transition-all transform hover:scale-105 active:scale-95 flex items-center justify-center gap-2 mx-auto"
        >
          <i class="fa-solid fa-rotate-right"></i> Volver a ver
        </button>
      </div>
    </div>

    <!-- Mensaje de respaldo en caso de error de conexión -->
    <div id="videoErrorBanner" class="hidden absolute inset-0 bg-slate-950/95 flex-col items-center justify-center p-6 text-center z-50 space-y-4">
      <i class="fa-solid fa-triangle-exclamation text-amber-500 text-3xl"></i>
      <p class="text-sm text-slate-300 max-w-md">
        No se pudo cargar el video directamente desde GitHub. Puedes seleccionar el archivo de video desde tu dispositivo:
      </p>
      <label class="cursor-pointer px-4 py-2 bg-[#8B4513] hover:bg-[#A0522D] transition text-white text-xs font-semibold rounded-lg shadow-lg">
        <i class="fa-solid fa-file-video mr-1.5"></i> Cargar video local
        <input type="file" id="localVideoInput" accept="video/*" class="hidden">
      </label>
    </div>

    <!-- 1. Botón 1: Parroquia Rosario De Fátima (Aparece 18.5s - 24.0s) -->
    <a
      id="btnParroquia"
      href="https://www.google.com/maps/search/?api=1&query=Parroquia+Rosario+De+Fatima"
      target="_blank"
      rel="noopener noreferrer"
      class="absolute top-[85%] left-1/2 -translate-x-1/2 -translate-y-1/2 z-20 pointer-events-none opacity-0 scale-90 flex items-center gap-2 px-3 py-1.5 btn-maps rounded-lg shadow-2xl"
    >
      <div class="w-5 h-5 rounded-full bg-white/20 flex items-center justify-center text-white text-xs shrink-0">
        <i class="fa-solid fa-location-dot"></i>
      </div>
      <span class="text-xs font-medium tracking-tight whitespace-nowrap">
        Ver ubicación
      </span>
    </a>

    <!-- 2. Botón 2: Salón Victoria's (Aparece 26.0s - 31.0s) -->
    <a
      id="btnSalon"
      href="https://www.google.com/maps/search/?api=1&query=Salon+Victorias"
      target="_blank"
      rel="noopener noreferrer"
      class="absolute top-[42%] left-1/2 -translate-x-1/2 -translate-y-1/2 z-20 pointer-events-none opacity-0 scale-90 flex items-center gap-2 px-3 py-1.5 btn-maps rounded-lg shadow-2xl"
    >
      <div class="w-5 h-5 rounded-full bg-white/20 flex items-center justify-center text-white text-xs shrink-0">
        <i class="fa-solid fa-location-dot"></i>
      </div>
      <span class="text-xs font-medium tracking-tight whitespace-nowrap">
        Ver ubicación
      </span>
    </a>

    <!-- 3. Botón 3: Confirmar asistencia (Aparece 27.0s - 30.8s) -->
    <a
      id="btnConfirmar"
      href="https://api.whatsapp.com/send?phone=527292387218&text=Hola,%20confirmo%20mi%20asistencia"
      target="_blank"
      rel="noopener noreferrer"
      class="absolute top-[80%] left-1/2 -translate-x-1/2 -translate-y-1/2 z-20 pointer-events-none opacity-0 scale-90 flex items-center gap-2 px-3 py-1.5 btn-maps rounded-lg shadow-2xl"
    >
      <div class="w-5 h-5 rounded-full bg-white/20 flex items-center justify-center text-white text-xs shrink-0">
        <i class="fa-brands fa-whatsapp"></i>
      </div>
      <span class="text-xs font-medium tracking-tight whitespace-nowrap">
        Confirmar asistencia
      </span>
    </a>
  </main>

  <!-- Lógica JavaScript para control de visibilidad y reproducción -->
  <script>
    const video = document.getElementById('mainVideo');
    const audio = document.getElementById('bgAudio');
    const btnPlayCenter = document.getElementById('btnPlayCenter');
    const btnParroquia = document.getElementById('btnParroquia');
    const btnSalon = document.getElementById('btnSalon');
    const btnConfirmar = document.getElementById('btnConfirmar');
    const outfitOverlay = document.getElementById('outfitOverlay');
    const btnReplay = document.getElementById('btnReplay');
    const videoErrorBanner = document.getElementById('videoErrorBanner');
    const localVideoInput = document.getElementById('localVideoInput');

    // Tiempos exactos de los botones (en segundos)
    const BTN1_START = 18.5;
    const BTN1_END = 24.0;

    const BTN2_START = 26.0;
    const BTN2_END = 31.0;

    const BTN3_START = 27.0;
    const BTN3_END = 30.8;

    function playMedia() {
      hideOverlay();
      video.play();
      audio.play().catch(e => console.log("Audio play blocked:", e));
      btnPlayCenter.classList.add('hidden');
    }

    function pauseMedia() {
      video.pause();
      audio.pause();
      if (video.currentTime < video.duration) {
        btnPlayCenter.classList.remove('hidden');
      }
    }

    btnPlayCenter.addEventListener('click', playMedia);

    video.addEventListener('play', () => {
      hideOverlay();
      audio.play().catch(e => console.log("Audio play blocked:", e));
      btnPlayCenter.classList.add('hidden');
    });

    video.addEventListener('pause', () => {
      audio.pause();
      if (video.currentTime < video.duration) {
        btnPlayCenter.classList.remove('hidden');
      }
    });

    // Mostrar overlay al finalizar el video
    video.addEventListener('ended', () => {
      audio.pause();
      showOverlay();
    });

    function showOverlay() {
      outfitOverlay.classList.remove('hidden');
      setTimeout(() => {
        outfitOverlay.classList.remove('opacity-0');
        outfitOverlay.classList.add('opacity-100');
      }, 10);
    }

    function hideOverlay() {
      outfitOverlay.classList.remove('opacity-100');
      outfitOverlay.classList.add('opacity-0');
      setTimeout(() => {
        outfitOverlay.classList.add('hidden');
      }, 500);
    }

    btnReplay.addEventListener('click', () => {
      video.currentTime = 0;
      audio.currentTime = 0;
      playMedia();
    });

    // Sincronizar audio al adelantar o atrasar el video
    video.addEventListener('seeking', () => {
      audio.currentTime = video.currentTime;
      if (video.currentTime < video.duration) {
        hideOverlay();
      }
    });

    video.addEventListener('seeked', () => {
      audio.currentTime = video.currentTime;
    });

    function toggleElement(element, show) {
      if (show) {
        element.classList.remove('opacity-0', 'scale-90', 'pointer-events-none');
        element.classList.add('opacity-100', 'scale-100', 'pointer-events-auto');
      } else {
        element.classList.remove('opacity-100', 'scale-100', 'pointer-events-auto');
        element.classList.add('opacity-0', 'scale-90', 'pointer-events-none');
      }
    }

    function updateButtonsVisibility() {
      const current = video.currentTime;
      toggleElement(btnParroquia, current >= BTN1_START && current < BTN1_END);
      toggleElement(btnSalon, current >= BTN2_START && current < BTN2_END);
      toggleElement(btnConfirmar, current >= BTN3_START && current < BTN3_END);
    }

    video.addEventListener('timeupdate', updateButtonsVisibility);

    video.addEventListener('error', () => {
      videoErrorBanner.classList.remove('hidden');
      videoErrorBanner.classList.add('flex');
    });

    localVideoInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        video.src = URL.createObjectURL(file);
        videoErrorBanner.classList.add('hidden');
        videoErrorBanner.classList.remove('flex');
        playMedia();
      }
    });
  </script>
</body>
</html>
